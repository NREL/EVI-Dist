site_name: EVI-DiST Documentation (v1.0.1)
nav:
  - Home: index.md
  - Installation: installation.md
  - User guide:
    - EVI-DiST Lite: lite.md
    - EVI-DiST Plus: plus.md
  - About:
    - License: license.md
    - Release Notes: release-notes.md
theme:
  name: mkdocs
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
  user_color_mode_toggle: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - mathjax-config.js
markdown_extensions:
  - attr_list
